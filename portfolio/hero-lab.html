<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Colour Lab</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #f6f4f0; --fg: #1d1d1b; --muted: #6b6a66; --card: #fff; --line: #e4e1db; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141412; --fg: #f1efea; --muted: #a09d96; --card: #1d1d1b; --line: #2e2d2a; } }
  :root[data-theme="dark"] { --bg: #141412; --fg: #f1efea; --muted: #a09d96; --card: #1d1d1b; --line: #2e2d2a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
  header { max-width: 1280px; margin: 0 auto; padding: 40px 16px 8px; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--muted); max-width: 60ch; }
  .grid { max-width: 1280px; margin: 0 auto; padding: 24px 16px 64px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 24px; }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .shot { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #0b0f2a; }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 55%; }
  .shot::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, #0a0d2899 0%, #0a0d2833 38%, #0a0d2833 62%, #0a0d2880 100%); }
  .shot .tint { position: absolute; inset: 0; z-index: 1; mix-blend-mode: soft-light; }
  .shot h2 { position: absolute; z-index: 2; left: 0; right: 0; top: 38%; transform: translateY(-50%); margin: 0; text-align: center; color: #fff; font-size: clamp(20px, 2.6vw, 30px); line-height: 1.12; font-weight: 500; letter-spacing: -.02em; text-shadow: 0 2px 28px #0a0d2866, 0 1px 4px #0a0d2840; }
  figcaption { padding: 14px 16px 16px; }
  figcaption b { display: block; font-weight: 600; }
  figcaption code { display: block; margin-top: 4px; color: var(--muted); font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-word; }
</style>
</head>
<body>
<header>
  <h1>Hero colour lab</h1>
  <p>Ten treatments of the homepage hero photo, with the same dark wash and headline as the live site. Tell me a number and I'll apply it to the hero.</p>
</header>
<main class="grid" id="grid"></main>
<script>
  var V = [
    ['1 · Current', 'none', ''],
    ['2 · Full grayscale', 'grayscale(1) contrast(.92)', ''],
    ['3 · Soft grayscale', 'grayscale(.85) contrast(.85) brightness(1.05)', ''],
    ['4 · Warm grey', 'grayscale(.7) sepia(.18) contrast(.88)', ''],
    ['5 · Muted colour', 'saturate(.45) contrast(.88) brightness(1.04)', ''],
    ['6 · Quiet blue', 'saturate(.5) hue-rotate(-12deg) contrast(.9)', ''],
    ['7 · Warm film', 'grayscale(.5) sepia(.3) contrast(.86) brightness(1.04)', ''],
    ['8 · Misty mono', 'grayscale(1) contrast(.78) brightness(1.1) blur(1px)', ''],
    ['9 · Cool silver', 'grayscale(.9) contrast(.88) brightness(1.03)', 'background:#7d93b8;opacity:.55'],
    ['10 · Faded matte', 'saturate(.3) contrast(.75) brightness(1.12)', 'background:#e8c9a6;opacity:.35']
  ];
  var g = document.getElementById('grid');
  V.forEach(function (v) {
    var f = document.createElement('figure');
    f.innerHTML = '<div class="shot"><img src="assets/hero-stage-1600.jpg" alt="" style="filter:' + v[1] + '"><div class="tint" style="' + v[2] + '"></div><h2>Shaping vision.<br>Building with purpose.</h2></div>' +
      '<figcaption><b>' + v[0] + '</b><code>filter: ' + v[1] + (v[2] ? ' + tint ' + v[2].split(';')[0].replace('background:', '') : '') + '</code></figcaption>';
    g.appendChild(f);
  });
</script>
</body>
</html>
